<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-label="Chữ ký Trương Tấn Nghĩa — AI Học Lập Trình · Never give up">
  <title>Trương Tấn Nghĩa signature</title>
  <defs>
    <linearGradient id="sig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E4A63"/>
      <stop offset="0.55" stop-color="#1E8FA8"/>
      <stop offset="1" stop-color="#F28C1B"/>
    </linearGradient>
    <!-- Giá trị gốc là hiển thị đầy đủ; SMIL chỉ tạo hiệu ứng "viết dần" khi trình xem hỗ trợ -->
    <clipPath id="reveal">
      <rect x="0" y="0" width="600" height="170">
        <animate attributeName="width" from="0" to="600" dur="2.6s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#reveal)">
    <text x="300" y="92" text-anchor="middle" font-family="Segoe Script, Brush Script MT, Lucida Handwriting, cursive" font-size="54" fill="url(#sig)">Trương Tấn Nghĩa</text>
    <path d="M90 112 C 200 128, 380 98, 520 112" fill="none" stroke="url(#sig)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="300" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#0E4A63">AI HỌC LẬP TRÌNH · NEVER GIVE UP</text>
</svg>
